name: fuzz

# Nightly, and never on a pull request.
#
# The seed corpus and every crasher under testdata/fuzz already run as ordinary
# subtests in `go test`, which is where a regression is caught -- for free, on
# every push, deterministically. Running -fuzz on a pull request spends minutes
# rediscovering that same corpus and can fail a change that has nothing to do
# with what it found.
#
# What the long run buys is the paths a minute does not reach, and the cache
# below is what makes the second night worth more than the first: without it
# every run starts cold from the seeds and finds what the previous one already
# found.
on:
  schedule:
    # 03:17 UTC. Not on the hour: the scheduler queues those and a job asking
    # for half an hour of a shared runner is the kind that waits.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: cache the corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          # The key moves every run and restore-keys falls back to the newest
          # one that exists, so each night starts from what the last one
          # learned. A fixed key would freeze the corpus at whatever the first
          # run produced.
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-

      - name: fuzz every target
        run: |
          set -uo pipefail
          # The targets are discovered rather than listed: a list in this file
          # is a list that goes stale the first time somebody adds a target and
          # does not think of CI.
          #
          # The discovery greps, so it reads a target behind a build tag as
          # readily as one in front of it. `go test` does not. The two
          # disagreeing is what guard two below is about.
          targets=$(
            grep -rl 'func Fuzz' --include='*_test.go' . |
              while read -r f; do
                d=$(dirname "$f")
                grep -ho 'func Fuzz[A-Za-z0-9_]*' "$f" | sed "s|func |${d#./} |"
              done | sort -u
          )

          # Guard one. A discovery that finds nothing runs the loop zero times
          # and exits 0: a green night that fuzzed nothing. This module has
          # targets, so an empty list means the discovery broke, not that the
          # targets went away.
          if [ -z "$targets" ]; then
            echo "::error::no fuzz target was discovered"
            exit 1
          fi
          echo "$targets"

          # A file of its own rather than a fixed path under /tmp: two copies of
          # this script on one machine must not read each other's output.
          log=$(mktemp)

          failed=0
          while read -r pkgdir target; do
            echo "::group::$target ($pkgdir)"

            # No -tags, and that is measured rather than assumed: this module
            # lists the same five packages with and without `integration e2e`,
            # and no test file carries a build tag at all. A tag passed to make
            # nothing visible is a tag that has to be kept right forever. If one
            # ever appears, guard two turns the target it hides into a red night
            # instead of a silent one, which is the report a person can act on.
            if go test "./$pkgdir" \
                 -run='^$' -fuzz="^$target\$" -fuzztime=5m 2>&1 | tee "$log"; then

              # Guard two, and it is the one that survives a build tag this file
              # has never heard of. Asked for a target it did not compile, `go
              # test` exits 0: being told to fuzz nothing is not an error to it.
              #
              # The check is for the evidence that fuzzing happened rather than
              # for any particular complaint, because the complaint is not
              # reliable. A package that holds other targets prints "no fuzz
              # tests to fuzz"; a package that holds none prints nothing at all
              # and just says ok. Both are a target that never ran, and only one
              # of them says so. A run that did happen always opens with
              # `fuzz: elapsed: 0s, gathering baseline coverage`, even at the
              # shortest fuzztime.
              if ! grep -q 'fuzz: elapsed:' "$log"; then
                failed=1
                echo "::error::$target was never fuzzed: ./$pkgdir passed without running it"
              fi
            else
              failed=1
              echo "::error::$target found a crasher"
            fi
            echo "::endgroup::"
          done <<< "$targets"
          exit "$failed"

      - name: keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashers
          # A crasher belongs in testdata/fuzz, committed by a person who read
          # it. CI that commits its own corpus fills the repository with inputs
          # nobody has looked at.
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
