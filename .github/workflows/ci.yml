name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version,
          # and setup-go installs exactly that -- the .0 of it, whose standard
          # library carries vulnerabilities fixed later. govulncheck below is
          # right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against.
          go-version: stable

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # `gofmt -l .` skips nothing, and two kinds of file are not valid Go on
        # purpose: testdata holds fixtures meant to be refused, and gofmt is the
        # one tool in this chain that does not read build tags, so a file the
        # compiler excludes by one still reaches it.
        #
        # Neither kind is in this module today. The command is the same in every
        # repository so that the first one arriving does not also need CI
        # changed for it.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # The three steps that compile the module ask with the same tags the
      # layout guard below asks with. Nothing here carries a build tag today --
      # the same five packages and the same 86 tests are listed either way --
      # so this changes no result. It changes what happens the day a suite goes
      # behind a tag: without it, these steps stop compiling that suite and say
      # nothing, and the job is green for having run less than it did before.
      # The guard would still see the package, so the two would disagree about
      # what the module contains, and only the quieter one gates the merge.
      #
      # Comma-separated, not space-separated. Go still recognises the space
      # form and deprecated it, so `-tags 'integration e2e'` is right here and
      # wrong three steps down: govulncheck takes only the comma form and reads
      # the other as one tag literally named "integration e2e", which satisfies
      # no file. It would not fail -- it would scan as if no tag were given, on
      # a line that says one was.
      - name: vet
        run: go vet -tags integration,e2e ./...

      - name: test
        run: go test -tags integration,e2e -race ./...

      # The suite is only run by go test when its files are named for it, and a
      # file that is not is skipped without a word. Review does not catch that
      # twice in a row, so it is a command.
      - name: test layout
        run: bash tests/test-layout-guard.sh

      # Two dependencies, both ours, and nothing third-party behind them.
      #
      # The package and its suite name each symbol by the path it is declared
      # at: hesape for what the framework only re-exports, the framework for
      # what it declares -- the router, the session store and the guards the
      # suite mounts the server behind. Those are the two direct requires.
      # Anything else is not what this package is made of: it is imported by
      # applications that expose themselves to an assistant, and a third
      # require is a download for all of them.
      #
      # Two checks, because a go.mod read alone answers half the question. The
      # first reads the direct requires. The second asks the toolchain which
      # modules the build -- the suite and the tags included -- takes packages
      # from, which is where a third-party module arriving through one of the
      # two would show up: go.mod lists only what the main module requires, and
      # an indirect line passed the direct check by being indirect.
      #
      # The pattern anchors on `^[[:space:]]*`, and the leading `*` rather than
      # a `+` is what reads both shapes go.mod writes a require in: a bare
      # `require <path> <version>` at column zero, and an indented `require (`
      # block. `go mod edit -fmt` keeps whichever it finds, and a pattern
      # demanding leading whitespace never read the first.
      #
      # `v[0-9]` after the path is what keeps `module`, `go`, `toolchain`,
      # `retract` and the one-line form of `replace` and `exclude` out without
      # naming them: a require entry is the only line here that is a path and a
      # version and nothing else. The `=>` filter drops the body of a replace
      # block, whose lines have that shape too. The body of an exclude block
      # would still be reported -- there is none, and a check that errs errs
      # towards saying so.
      #
      # Both checks count what they read. A pattern that matches nothing, a
      # `go list` that fails, and a go.mod with no forbidden dependency all
      # print the same empty string, so a check that does not count is loudest
      # about being clean exactly when it has stopped reading.
      - name: two dependencies
        run: |
          entries=$(grep -E '^[[:space:]]*(require[[:space:]]+)?[^[:space:]]+/[^[:space:]]*[[:space:]]+v[0-9]' go.mod | grep -v '=>' || true)

          scanned=0
          if [ -n "$entries" ]; then
            scanned=$(printf '%s\n' "$entries" | grep -c '')
          fi
          if [ "$scanned" -eq 0 ]; then
            echo "no require entry was read, so nothing about the dependencies was checked."
            echo "go.mod has $(grep -c '' go.mod) lines and the pattern matched none of them."
            exit 1
          fi

          extra=$(printf '%s\n' "$entries" | grep -v '// indirect' \
                    | grep -vE 'github\.com/arandu-io/(framework|hesape)[[:space:]]' || true)
          if [ -n "$extra" ]; then
            echo "this module requires something beyond the framework and hesape:"
            echo "$extra"
            exit 1
          fi

          if ! built=$(go list -deps -test -tags integration,e2e -f '{{with .Module}}{{.Path}}{{end}}' ./... 2>&1); then
            echo "go list failed, so the modules the build takes packages from were not read:"
            echo "$built"
            exit 1
          fi
          modules=$(printf '%s\n' "$built" | sort -u | grep -v '^$' || true)
          if ! printf '%s\n' "$modules" | grep -qx 'github.com/arandu-io/mcp'; then
            echo "the build was read and this module was not in it, so the list is not the build:"
            echo "$modules"
            exit 1
          fi

          # golang.org/x/ is the Go project's own, and it reaches this build
          # only through the two: it is where the core's one dependency, the
          # cryptography, lives.
          third=$(printf '%s\n' "$modules" | grep -vE '^github\.com/arandu-io/|^golang\.org/x/' || true)
          if [ -n "$third" ]; then
            echo "the build takes packages from a module that is neither ours nor the Go project's:"
            echo "$third"
            exit 1
          fi

          echo "read $scanned require entries and $(printf '%s\n' "$modules" | grep -c '') modules in the build;"
          echo "the direct requires are the framework and hesape, and nothing in the build is third-party"

      # No Node, in every shape it arrives in.
      #
      # The names are the manifest, the lockfiles, the installed tree, and the
      # registry and version config. The lockfiles are the half that was
      # missing, and they are the half that matters: package.json is a wish
      # list, a lockfile is a resolved Node graph, and each package manager
      # writes a different one. yarn.lock, pnpm-lock.yaml, package-lock.json,
      # npm-shrinkwrap.json, bun.lockb and .npmrc all passed the three names
      # this step used to read.
      #
      # .git is pruned rather than filtered back out of the output: a name
      # matched inside it was never a file of this project, and not descending
      # into it is the same answer sooner.
      #
      # No `|| true`. find exits 0 when it matches nothing, which is the healthy
      # answer here and the one this step expects; it exits non-zero when it
      # could not read part of the tree, which is a walk that did not happen.
      # The old form turned that into a pass -- pointed at a directory it could
      # not open, it printed the permission error and reported no Node.
      - name: no Node
        run: |
          found=$(find . -path ./.git -prune -o \
            \( -name 'package.json' -o -name 'package-lock.json' \
               -o -name 'npm-shrinkwrap.json' -o -name 'yarn.lock' \
               -o -name 'pnpm-lock.yaml' -o -name 'bun.lock' -o -name 'bun.lockb' \
               -o -name 'node_modules' -o -name '.npmrc' -o -name '.nvmrc' \
               -o -name 'vite.config.*' \) -print)
          if [ -n "$found" ]; then
            echo "Node entered the view layer:"
            echo "$found"
            exit 1
          fi

      # A known vulnerability blocks the merge rather than showing up in a
      # report nobody reads.
      # Tagged for the reason the vet and test steps are, and it matters most
      # here: a scanner that silently stops reading part of the module reports
      # the same clean result as one that read all of it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags integration,e2e ./...
